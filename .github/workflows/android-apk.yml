name: Android APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بناء APK (تصحيح)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Gradle 8.7
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت مكوّنات SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: توليد غلاف Gradle
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: بناء APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: رفع غلاف Gradle
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
          if-no-files-found: warn
          retention-days: 30
