name: Android APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بناء APK (تصحيح)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v5

      - name: تجهيز Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ملاحظة: لا نستخدم android-actions/setup-android لأن sdkmanager
      # داخله ينفّذ "sdkmanager tools" وهي حزمة أُزيلت من مستودع Google،
      # فتُفشل الوظيفة. نستخدم SDK الجاهز في runner بدلًا منها.
      - name: تجهيز Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "[!] لم يُعثر على sdkmanager في $SDK_ROOT" >&2
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: تثبيت Gradle 8.7
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: توليد غلاف Gradle
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: بناء APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: رفع غلاف Gradle
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
          if-no-files-found: warn
          retention-days: 30
