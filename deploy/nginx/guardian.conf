# Guardian — Nginx reverse proxy
#
# Place at /etc/nginx/sites-available/guardian and symlink into sites-enabled.
# The app itself listens on 127.0.0.1:3000; only Nginx is exposed publicly.

upstream guardian_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name guardian.example.com;   # ← change to your domain or VPS IP

    # Certbot writes its challenge here; everything else goes straight to the app.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name guardian.example.com;   # ← change to your domain or VPS IP

    ssl_certificate     /etc/letsencrypt/live/guardian.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guardian.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:GuardianSSL:10m;
    ssl_session_timeout 1d;

    # Uploads (screenshots / photos) can be several megabytes.
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/guardian.access.log;
    error_log  /var/log/nginx/guardian.error.log;

    location / {
        proxy_pass http://guardian_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;           # keeps the WebSocket stream responsive
    }

    # WebSocket endpoint for live location updates.
    location /ws {
        proxy_pass http://guardian_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
